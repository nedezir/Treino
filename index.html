ul{padding-left:18px;margin:6px 0}li{margin:4px 0}

<script>
const V=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q+" execução correta shorts");
const D={
"Segunda":{t:"Peito + Tríceps",ex:[
["Supino reto",4,"6–10","2–3 min",150,"Escápulas retraídas, pés firmes, barra desce na linha do mamilo. Cotovelos ~45°."],
["Supino inclinado com halteres",3,"8–12","2 min",120,"Banco 30–45°. Desça controlando até alongar o peito, sem bater os halteres."],
["Chest press / máquina",3,"8–12","90 s",90,"Ajuste o banco para a pegada ficar na altura do meio do peito. Não trave os cotovelos."],
["Crossover",3,"10–15","60–90 s",75,"Leve inclinação à frente, cotovelos levemente flexionados e fixos. Aperte no final."],
["Tríceps pulley",3,"8–12","90 s",90,"Cotovelos colados ao corpo. Só o antebraço se move."],
["Tríceps francês",3,"10–15","60–90 s",75,"Cotovelos apontados para cima, desça atrás da cabeça com controle."],
["Crunch na polia alta",3,"10–15","60–90 s",75,"Ajoelhado, quadril fixo: enrole o tronco levando as costelas em direção à pelve, sem puxar com os braços."]]},
"Terça":{t:"Quadríceps + Panturrilha",ex:[
["Agachamento",4,"6–10","2–3 min",150,"Tronco firme, joelhos acompanham a ponta dos pés, desça até onde mantém a lombar neutra."],
["Leg press",4,"8–12","2 min",120,"Lombar sempre encostada. Não trave os joelhos no topo."],
["Cadeira extensora",3,"10–15","60–90 s",75,"Segure 1 s no topo, desça em 2–3 s."],
["Afundo",3,"8–12","90 s",90,"Passo largo, joelho de trás desce quase ao chão, tronco ereto."],
["Panturrilha em pé",4,"10–15","60–90 s",75,"Amplitude total: alongue embaixo, pause 1 s no topo."],
["Panturrilha sentado",3,"12–20","60 s",60,"Movimento lento e completo, sem quicar."]]},
"Quarta":{t:"Costas + Bíceps",ex:[
["Puxada alta",4,"6–10","2 min",120,"Peito para cima, puxe a barra até o alto do peito levando os cotovelos para baixo."],
["Remada máquina",3,"8–12","2 min",120,"Peito apoiado, puxe com os cotovelos e junte as escápulas."],
["Remada unilateral",3,"8–12","90 s",90,"Costas retas, puxe o halter em direção ao quadril."],
["Pulldown",3,"10–15","60–90 s",75,"Braços quase estendidos, leve a barra até as coxas usando o dorsal. (Pullover no cabo)"],
["Rosca direta",3,"8–12","90 s",90,"Cotovelos fixos ao lado do corpo, sem balançar o tronco."],
["Rosca martelo",3,"10–15","60–90 s",75,"Pegada neutra, suba e desça controlado."],
["Encolhimento com halteres",3,"10–15","60–90 s",75,"Suba os ombros em direção às orelhas, pausa de 1 s no topo e desça controlado, sem girar os ombros."],
["Elevação de pernas",3,"10–15","60 s",60,"Pendurado na barra ou deitado no banco/colchonete: suba as pernas até o quadril enrolar, sem balançar, e desça devagar. Se ficar fácil, segure uma anilha leve entre os pés."]]},
"Quinta":{t:"Posterior + Glúteos",ex:[
["Terra romeno",4,"6–10","2–3 min",150,"Joelhos levemente flexionados, empurre o quadril para trás, barra rente às pernas, coluna neutra."],
["Mesa flexora",4,"8–12","90 s",90,"Quadril colado no banco, desça devagar."],
["Cadeira flexora",3,"10–15","60–90 s",75,"Ajuste o encosto para o joelho alinhar com o eixo da máquina."],
["Hip thrust",4,"8–12","2 min",120,"Queixo para dentro, suba até o quadril alinhar com o tronco, aperte o glúteo 1 s."],
["Abdutora",3,"12–20","60 s",60,"Tronco levemente à frente para mais glúteo; controle a volta."],
["Panturrilha",4,"12–20","60 s",60,"Amplitude completa, pausa no topo e embaixo."]]},
"Sexta":{t:"Ombros + Braços",ex:[
["Desenvolvimento com halteres",3,"6–10","2 min",120,"Sentado com apoio, halteres descem até a altura das orelhas, sem arquear a lombar."],
["Elevação lateral",4,"10–15","60–90 s",75,"Suba até a altura dos ombros, cotovelo levemente à frente, sem impulso."],
["Crucifixo inverso",3,"12–15","60–90 s",75,"Abra os braços focando o deltoide posterior, sem juntar demais as escápulas."],
["Rosca direta",3,"8–12","90 s",90,"Cotovelos fixos, desça em 2–3 s."],
["Rosca martelo",3,"10–12","60–90 s",75,"Pegada neutra, sem balançar."],
["Tríceps testa",3,"8–12","90 s",90,"Barra W desce em direção à testa, cotovelos apontados para o teto."],
["Tríceps corda",3,"10–15","60–90 s",75,"Abra a corda no final do movimento, cotovelos fixos."],
["Crunch declinado com anilha",3,"10–15","60 s",60,"Anilha junto ao peito, suba enrolando a coluna e desça controlado, sem balançar."]]}
};
const PH={1:"Sem 1–2: RIR 2–3 — foco em técnica e amplitude.",2:"Sem 1–2: RIR 2–3 — foco em técnica e amplitude.",3:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",4:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",5:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",6:"Sem 6–7: principais 6–10 reps, isoladores 10–15, RIR 1–2.",7:"Sem 6–7: principais 6–10 reps, isoladores 10–15, RIR 1–2.",8:"Sem 8 — DELOAD: corte ~40–50% das séries, cargas moderadas."};
// incremento de carga sugerido (kg) por exercício
const INC={"Supino reto":2.5,"Supino inclinado com halteres":2,"Chest press / máquina":5,"Crossover":2.5,"Tríceps pulley":2.5,"Tríceps francês":2,"Agachamento":5,"Leg press":10,"Cadeira extensora":5,"Afundo":2,"Panturrilha em pé":5,"Panturrilha sentado":5,"Puxada alta":5,"Remada máquina":5,"Remada unilateral":2,"Pulldown":2.5,"Rosca direta":2,"Rosca martelo":1,"Terra romeno":5,"Mesa flexora":2.5,"Cadeira flexora":5,"Hip thrust":10,"Abdutora":5,"Panturrilha":5,"Desenvolvimento com halteres":2,"Crunch na polia alta":2.5,"Elevação de pernas":2.5,"Crunch declinado com anilha":2.5,"Encolhimento com halteres":2,"Elevação lateral":1,"Crucifixo inverso":1,"Tríceps testa":2,"Tríceps corda":2.5};
// técnicas por dia: [semanaDe, semanaAté, [índices], tipo]
const TECH={
"Segunda":[[3,7,[4,5],"biset"],[6,7,[2],"rest"],[6,7,[3],"drop"]],
"Terça":[[3,7,[2,5],"biset"],[6,7,[1],"rest"],[6,7,[4],"drop"]],
"Quarta":[[3,7,[4,5],"biset"],[6,7,[1],"rest"],[6,7,[3],"drop"]],
"Quinta":[[3,7,[2,4],"biset"],[6,7,[1],"drop"],[3,7,[3],"pausa"]],
"Sexta":[[3,7,[3,5],"biset"],[3,7,[4,6],"biset"],[6,7,[1],"drop"],[6,7,[2],"drop"]]};
const TX={biset:"🔗 BI-SET",drop:"🔻 DROP-SET",rest:"⏸ REST-PAUSE",pausa:"⏱ PAUSA 2 s"};
const TD={drop:"Na ÚLTIMA série: ao chegar perto da falha, reduza ~25% da carga e faça mais reps até RIR 0–1. Só 1 drop.",
rest:"Na ÚLTIMA série: chegue a RIR 1, descanse 15 s, faça mais 2–4 reps, 15 s, mais 1–3 reps.",
pausa:"Segure 2 s no topo de cada repetição (contração máxima). Use ~10% menos carga se precisar."};
function techFor(day,i){const out=[];(TECH[day]||[]).forEach(t=>{if(S.wk<t[0]||S.wk>t[1])return;const p=t[2].indexOf(i);if(p<0)return;
if(t[3]=="biset"){const o=t[2][1-p];const on=D[day].ex[o][0];
out.push({type:"biset",txt:p==0?`Faça junto com <b>${on}</b> (nº ${o+1}): sem descanso entre os dois; descanse só depois do 2º.`:`2º do bi-set com <b>${on}</b> (nº ${o+1}). Descanse agora.`,first:p==0})}
else out.push({type:t[3],txt:TD[t[3]]})});return out}
function parse(v){if(!v)return null;v=v.replace(",",".");const m=v.match(/(\d+(?:\.\d+)?)/);if(!m)return null;const kg=+m[1];
const rest=v.slice(m.index+m[0].length);const r=rest.match(/\d+(?:\s*\/\s*\d+)+|\d+/);const reps=r?r[0].split("/").map(x=>+x.trim()):[];return{kg,reps}}
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:null};
const setsOf=(k,w)=>{const a=(S.sl[k]||{})[w]||[];return Array.from({length:4},(_,i)=>({c:(a[i]||{}).c||"",r:(a[i]||{}).r||""}))};
function topOf(k,w){const ss=setsOf(k,w).map(s=>({c:num(s.c),r:num(s.r)})).filter(s=>s.c!==null);if(!ss.length)return null;
const kg=Math.max(...ss.map(s=>s.c));const reps=ss.filter(s=>s.c===kg&&s.r!==null).map(s=>s.r);return{kg,reps}}
function sugest(e,k){const name=e[0],inc=INC[name]||2.5;const [lo,hi]=e[2].split("–").map(Number);
if(S.wk==8){const p=topOf(k,7)||topOf(k,6);return p?`Deload: use ~${r5(p.kg*0.8)} kg, parando com RIR 3.`:"Deload: carga ~20% menor que a sem. 7, RIR 3."}
if(S.wk==1)return"Semana 1: encontre uma carga em que termine a série com 2–3 reps sobrando.";
const p=topOf(k,S.wk-1);if(!p)return`Anote as cargas da semana ${S.wk-1} para ver a sugestão.`;
if(!p.reps.length)return`Semana passada: ${p.kg} kg. Anote as reps dessa carga para a sugestão.`;
if(p.reps.every(x=>x>=hi))return`🔼 Bateu ${hi} reps com ${p.kg} kg: suba para <b>${r5(p.kg+inc)} kg</b> e mire ${lo}–${lo+2} reps.`;
const min=Math.min(...p.reps);
if(min<lo)return`Abaixo da faixa (${min} reps com ${p.kg} kg): mantenha ou reduza para <b>${r5(p.kg-inc)} kg</b> e foque na técnica.`;
return`➡️ Mantenha <b>${p.kg} kg</b> e tente +1 rep nas séries abaixo de ${hi}.`}
function r5(x){return Math.round(x*2)/2}
const VER="4";
const DEF_H=["07:00","09:30","12:30","15:30","19:30","22:00"];
const DEF_MEALS=["Café da manhã","Lanche da manhã","Almoço","Lanche da tarde","Jantar","Ceia"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=iso=>iso.slice(8,10)+"/"+iso.slice(5,7);
const brn=(n,dec=1)=>(+n).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:dec});
function applyFs(){document.documentElement.style.zoom=[1,1.12,1.25][S.opt.fs||0]||1}
function setFs(n){S.opt.fs=n;save();applyFs();render()}


let S={};try{S=JSON.parse(localStorage.getItem("treino8")||"{}")}catch(e){}
const norm=()=>{S.sl=S.sl||{};S.wk=S.wk||1;S.log=S.log||{};S.done=S.done||{};S.cd=S.cd||{};S.water=S.water||{};S.wgoal=S.wgoal||{};
S.opt=Object.assign({sound:true,auto:true,fs:0},S.opt||{});S.meas=S.meas||[];S.swap=S.swap||{};S.dietDone=S.dietDone||{};
S.diet=S.diet||{};S.diet.goal=S.diet.goal||{};S.diet.meals=S.diet.meals||DEF_MEALS.map((n,i)=>({id:"m"+i,n,h:DEF_H[i],f:"",k:"",p:"",c:"",g:""}))};
let dbDoc=null,saveT=null,dirty=false;
const setSync=t=>{const e=document.getElementById("sync");if(e)e.textContent=t};
function flush(){clearTimeout(saveT);saveT=setTimeout(()=>{dbDoc.set({s:JSON.stringify(S),t:Date.now()}).then(()=>{dirty=false;setSync("☁ salvo na sua conta")}).catch(e=>setSync("⚠ erro ao salvar ("+((e&&e.code)||"?")+")"))},400)}
const save=()=>{try{localStorage.setItem("treino8",JSON.stringify(S))}catch(e){}
dirty=true;if(dbDoc)flush()};
norm();
function merge(r){S.log=S.log||{};for(const k in (r.log||{}))S.log[k]=Object.assign({},r.log[k],S.log[k]||{});
S.done=S.done||{};for(const k in (r.done||{}))S.done[k]=[...new Set([...(r.done[k]||[]),...(S.done[k]||[])])];
S.cd=Object.assign({},r.cd||{},S.cd||{});S.water=Object.assign({},r.water||{},S.water||{});S.wgoal=Object.assign({},r.wgoal||{},S.wgoal||{})}
(async()=>{setSync("conectando…");try{
if(!window.claude||!claude.use){setSync("💾 salvo neste aparelho · v"+VER+"");return}
const db=await claude.use("db");if(!db){setSync("⚠ só neste aparelho (banco indisponível)");return}
const user=await claude.use("user");if(!user){setSync("⚠ só neste aparelho (usuário indisponível)");return}
const id=await user.id();if(!id){setSync("⚠ só neste aparelho (sem id)");return}
const ref=db.doc("data/users/"+id+"/treino");const snap=await ref.get();
let r=null;if(snap.exists){try{r=JSON.parse(snap.data().s)}catch(e){}}
if(r&&typeof r==="object"){if(dirty){merge(r)}else{S=r;norm()}try{localStorage.setItem("treino8",JSON.stringify(S))}catch(e){}render()}

/* ---------- recordes ---------- */
function records(){const per={};
Object.keys(S.sl).forEach(k=>{const nm=nameOfKey(k);Object.keys(S.sl[k]).forEach(w=>{(S.sl[k][w]||[]).forEach(s=>{const c=num(s.c),r=num(s.r);if(c===null||c<=0)return;const o=per[nm]=per[nm]||{};const b=o[w];if(!b||c>b.c||(c===b.c&&(r||0)>(b.r||0)))o[w]={c,r}})})});
return Object.keys(per).map(nm=>{const ws=Object.keys(per[nm]).map(Number).sort((a,b)=>a-b);let best=null;ws.forEach(w=>{const x=per[nm][w];if(!best||x.c>best.c)best={c:x.c,r:x.r,w}});
return{nm,kg:best.c,reps:best.r,wk:best.w,isNew:best.w===S.wk&&ws.length>1}}).sort((a,b)=>(b.isNew-a.isNew)||a.nm.localeCompare(b.nm))}

/* ---------- resumo da semana ---------- */
function volWk(w){let v=0;days.forEach(d=>D[d].ex.forEach((_,i)=>setsOf(kEx(d,i,w),w).forEach(s=>{const c=num(s.c),r=num(s.r);if(c!==null&&r!==null)v+=c*r})));return v}
function resumo(){const wk=S.wk;let tEx=0,tDone=0,tSets=0,tVol=0,tCard=0;
const rows=days.map(d=>{const ex=D[d].ex,done=(S.done[wk+"|"+d]||[]).length;let sets=0,vol=0;
ex.forEach((_,i)=>{setsOf(kEx(d,i,wk),wk).forEach(s=>{const c=num(s.c),r=num(s.r);if(c!==null||r!==null)sets++;if(c!==null&&r!==null)vol+=c*r})});
const card=CARDIO[d]?((S.cd["c|"+wk+"|"+d]||{}).d?1:0):null;const w=S.water[wk+"|"+d]||0;
tEx+=ex.length;tDone+=done;tSets+=sets;tVol+=vol;if(card)tCard+=card;
return `<tr><td><b>${d.slice(0,3)}</b></td><td>${done}/${ex.length}</td><td>${sets}</td><td>${brn(vol,0)}</td><td>${card===null?"":card?"✓":"–"}</td><td>${w?brn(w/1000,1)+" L":"–"}</td></tr>`}).join("");
const pv=wk>1?volWk(wk-1):0;const cmp=pv>0&&tVol>0?`${tVol>=pv?"+":"−"}${brn(Math.abs(tVol-pv)/pv*100,0)}% de volume em relação à semana ${wk-1}`:"";
const rec=records();
return `<div class="wk">📅<select onchange="S.wk=+this.value;save();render()">${[1,2,3,4,5,6,7,8].map(w=>`<option value="${w}" ${w==S.wk?"selected":""}>Semana ${w}</option>`).join("")}</select></div>
<div class="card"><h3>🏆 Resumo da semana ${wk}</h3><div class="grid">

${cmp?`<p class="small">${cmp}.</p>`:""}

const CH={};
function chart(title,unit,pts,color,id,dl){
if(!pts.length)return `<div class="card"><h3>${title}</h3><p class="small">Sem medidas ainda.</p></div>`;
CH[id]={pts,unit};const W=320,H=150,L=38,R=16,T=18,B=26;
const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){lo-=.5;hi+=.5}const pad=(hi-lo)*.15;const a=lo-pad,b=hi+pad;
const t0=Date.parse(pts[0].d),t1=Date.parse(pts[pts.length-1].d);
const X=p=>pts.length<2||t1===t0?(L+W-R)/2:L+(Date.parse(p.d)-t0)/(t1-t0)*(W-L-R);
const Y=v=>T+(b-v)/(b-a)*(H-T-B);
const ticks=[...new Set([Math.min(...vs),(Math.min(...vs)+Math.max(...vs))/2,Math.max(...vs)].map(v=>Math.round(v*10)/10))];
const grid=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#334155" stroke-width="1"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" fill="#94a3b8" font-size="10">${brn(v)}</text>`).join("");
const path=pts.map((p,i)=>(i?"L":"M")+X(p).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
const dots=pts.map((p,i)=>`<circle cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="${color}" stroke="#1e293b" stroke-width="2"/><circle cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="16" fill="transparent" onpointerdown="showPt('${id}',${i})"/>`).join("");
const last=pts[pts.length-1];
return `<div class="card"><h3>${title}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: ${pts.length} medidas, última ${brn(last.v)} ${unit}">${grid}
<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
<text x="${(X(last)).toFixed(1)}" y="${(Y(last.v)-10).toFixed(1)}" text-anchor="end" fill="#f1f5f9" font-size="11" font-weight="700">${brn(last.v)}</text>
<text x="${L}" y="${H-6}" fill="#94a3b8" font-size="10">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#94a3b8" font-size="10">${fmtD(last.d)}</text></svg>
<div class="ro" id="ro-${id}"><b>${brn(last.v)} ${unit}</b> · ${fmtD(last.d)}${dl?" · "+dl:""}</div></div>`}
function showPt(id,i){const c=CH[id],p=c&&c.pts[i],e=document.getElementById("ro-"+id);if(p&&e)e.innerHTML=`<b>${brn(p.v)} ${c.unit}</b> · ${fmtD(p.d)}/${p.d.slice(2,4)}`}
function medidas(){const ms=[...S.meas].sort((a,b)=>a.d<b.d?-1:1);
const pw=ms.filter(m=>m.w!=null).map(m=>({d:m.d,v:m.w})),pc=ms.filter(m=>m.c!=null).map(m=>({d:m.d,v:m.c}));
const delta=(a,u)=>{if(a.length<2)return"";const x=a[a.length-1].v-a[0].v;return`${x>0?"+":x<0?"−":""}${brn(Math.abs(x))} ${u} desde ${fmtD(a[0].d)}`};
return `<div class="card"><h3>📏 Nova medida</h3>
<div class="small" style="margin-bottom:8px">Uma vez por semana, no mesmo horário e de preferência em jejum. Cintura: na altura do umbigo, sem apertar a fita.</div>
<input class="in" type="date" id="md" value="${todayStr()}" max="${todayStr()}">
<div class="grid" style="margin-top:8px"><input class="in" id="mw" inputmode="decimal" placeholder="Peso (kg)"><input class="in" id="mc" inputmode="decimal" placeholder="Cintura (cm)"></div>
<button class="btn t" style="width:100%;margin-top:8px" onclick="saveMeas()">Salvar medida</button></div>`
+chart("Peso","kg",pw,"#38bdf8","mp",delta(pw,"kg"))+chart("Cintura","cm",pc,"#a78bfa","mc",delta(pc,"cm"))
+(ms.length?`<div class="card"><h3>Registros</h3><table><tr><th>Data</th><th>Peso</th><th>Cintura</th><th></th></tr>`+ms.slice().reverse().map(m=>`<tr><td>${fmtD(m.d)}/${m.d.slice(2,4)}</td><td>${m.w!=null?brn(m.w)+" kg":"—"}</td><td>${m.c!=null?brn(m.c)+" cm":"—"}</td><td><button class="tab" style="padding:2px 10px" onclick="delMeas('${m.d}')">🗑</button></td></tr>`).join("")+`</table></div>`:"")}
function saveMeas(){const d=document.getElementById("md").value||todayStr(),w=num(document.getElementById("mw").value),c=num(document.getElementById("mc").value);
if(w===null&&c===null){alert("Digite o peso ou a cintura.");return}
if((w!==null&&(w<30||w>300))||(c!==null&&(c<30||c>250))){alert("Confira os valores: peso em kg e cintura em cm.");return}
const i=S.meas.findIndex(m=>m.d===d),o=i>=0?S.meas[i]:{d};if(w!==null)o.w=w;if(c!==null)o.c=c;if(i<0)S.meas.push(o);S.meas.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function delMeas(d){if(confirm("Apagar a medida de "+fmtD(d)+"?")){S.meas=S.meas.filter(m=>m.d!==d);save();render()}}

function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=="object"||Array.isArray(o)||!o.log)throw 0;if(!confirm("Substituir os registros atuais pelos do arquivo?"))return;S=o;norm();save();render();alert("Registros importados.")}catch(e){alert("Arquivo inválido.")}};r.readAsText(f);inp.value=""}
const key=(d,i)=>d+"|"+i;
function render(){tabs();const m=document.getElementById("main");

if(cur=="Medidas"){m.innerHTML=medidas();return}

const REC={};records().forEach(r=>REC[r.nm]=r);
const d=D[cur];const dk=S.wk+"|"+cur;const done=S.done[dk]||[];
const n=d.ex.length,c=done.length;
m.innerHTML=`<div class="wk">📅<select onchange="S.wk=+this.value;save();render()">${[1,2,3,4,5,6,7,8].map(w=>`<option value="${w}" ${w==S.wk?"selected":""}>Semana ${w}</option>`).join("")}</select></div>
<div class="phase">${PH[S.wk]}</div>
${water()}
<div class="day-h">${cur} · ${d.t} <span class="small">(${c}/${n})</span></div>
<div class="prog"><i style="width:${c/n*100}%"></i></div>`+
d.ex.map((e0,i)=>{const e=exOf(cur,i),k=kEx(cur,i),sw=swapOf(cur,i);const L=S.log[k]||{};const isD=done.includes(i);
const series=S.wk==8?Math.max(2,Math.round(e[1]*0.55))+" (deload)":e[1];
const ws=new Set([...Object.keys(L),...Object.keys(S.sl[k]||{})]);
const hist=[...ws].filter(w=>w!=S.wk).sort((a,b)=>a-b).map(w=>{const cur2=setsOf(k,w).filter(s=>s.c||s.r);
if(cur2.length)return`Sem ${w}: `+cur2.map(s=>`${s.c||"?"}kg×${s.r||"?"}`).join(" · ");
return L[w]?`Sem ${w}: ${L[w]}`:""}).filter(Boolean).join("<br>");
const tc=techFor(cur,i);const bsFirst=tc.some(t=>t.type=="biset"&&t.first);const pr=REC[e[0]];
const prev=setsOf(k,S.wk-1),mine=setsOf(k,S.wk);
const grid=`<div class="sets"><div class="sh"></div><div class="sh">Carga (kg)</div><div class="sh">Reps</div>`+mine.map((s,i)=>`<div class="sn">S${i+1}</div>
<input inputmode="decimal" placeholder="${prev[i].c?prev[i].c+" kg":"kg"}" value="${s.c}" onchange="setS('${k}',${i},'c',this.value)">
<input inputmode="numeric" placeholder="${prev[i].r?prev[i].r:"reps"}" value="${s.r}" onchange="setS('${k}',${i},'r',this.value,${bsFirst?0:e[4]})">`).join("")+`</div>`;
return `<div class="ex ${isD?"done":""} ${tc.length?"tq":""}">

${pr?`<div class="small" style="margin:-4px 0 10px">🏆 Recorde: ${brn(pr.kg)} kg${pr.reps?" × "+pr.reps:""} (sem ${pr.wk})${pr.isNew?" · <b style=\"color:var(--ac)\">novo!</b>":""}</div>`:""}

${grid}
${hist?`<div class="hist"><b>Histórico</b><br>${hist}</div>`:""}
</div>`}).join("")+cardio(cur)}
const CARDIO={"Terça":1,"Quinta":1};

function tgc(k){S.cd[k]=S.cd[k]||{};S.cd[k].d=!S.cd[k].d;save();render()}
function lgc(k,v){S.cd[k]=S.cd[k]||{};S.cd[k].t=v.trim();save()}
function tog(i){const dk=S.wk+"|"+cur;const a=S.done[dk]=S.done[dk]||[];const p=a.indexOf(i);p<0?a.push(i):a.splice(p,1);save();render()}
function setS(k,i,f,v,rest){S.sl[k]=S.sl[k]||{};const a=S.sl[k][S.wk]=S.sl[k][S.wk]||[{},{},{},{}];a[i]=a[i]||{};const old=a[i][f]||"";a[i][f]=String(v).trim();save();if(f==="r"&&!old&&a[i][f]&&S.opt.auto&&rest>0)startT(rest)}
function lg(k,v){S.log[k]=S.log[k]||{};S.log[k][S.wk]=v.trim();save()}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

let endAt=0,iv=null,fin=false,wl=null,hideT=null,audioEl=null,actx=null,unlocked=false;
const tEl=()=>document.getElementById("timer");
function mkWav(){const sr=22050,beeps=[[0,.22],[.34,.56],[.68,.90]],n=Math.floor(sr*1.2),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
for(let i=0;i<n;i++){const t=i/sr;let a=0;for(const [s,e] of beeps){if(t>=s&&t<e){const env=Math.min(1,(t-s)/.01,(e-t)/.02);a=Math.sin(2*Math.PI*1000*t)*0.9*env}}v.setInt16(44+i*2,Math.round(a*32767),true)}
return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))}
function unlockAudio(){if(unlocked)return;
try{if(!audioEl){audioEl=new Audio(mkWav());audioEl.preload="auto"}audioEl.muted=true;const p=audioEl.play();
if(p&&p.then)p.then(()=>{audioEl.pause();audioEl.currentTime=0;audioEl.muted=false;unlocked=true}).catch(()=>{audioEl.muted=false})}catch(e){}
try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){actx=actx||new AC();if(actx.state==="suspended")actx.resume()}}catch(e){}}
["touchend","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function webBeep(){try{const AC=window.AudioContext||window.webkitAudioContext;actx=actx||new AC();if(actx.state==="suspended")actx.resume();
[0,.34,.68].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime+t;o.frequency.value=1000;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.8,n+.01);g.gain.exponentialRampToValueAtTime(0.0001,n+.22);o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+.25)})}catch(e){}}
function playAlarm(){try{if(audioEl){audioEl.muted=false;audioEl.currentTime=0;const p=audioEl.play();if(p&&p.catch)p.catch(webBeep);return}}catch(e){}webBeep()}
function testSound(){try{if(!audioEl)audioEl=new Audio(mkWav());unlocked=true}catch(e){}playAlarm()}
function startT(s){if(!(s>0))return;fin=false;clearTimeout(hideT);endAt=Date.now()+s*1000;tEl().classList.remove("end");tEl().classList.add("on");document.getElementById("tl").textContent="Descanso";clearInterval(iv);iv=setInterval(tick,250);tick();wake(true)}
function tick(){const left=Math.ceil((endAt-Date.now())/1000);if(left<=0){clearInterval(iv);document.getElementById("tv").textContent="0:00";if(!fin){fin=true;finish()}return}document.getElementById("tv").textContent=fmt(left)}
function finish(){tEl().classList.add("end");document.getElementById("tl").textContent="Descanso acabou! 💪";if(S.opt.sound)playAlarm();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}clearTimeout(hideT);hideT=setTimeout(stopT,12000);wake(false)}
function addT(s){if(fin){if(s>0)startT(s);return}endAt=Math.max(Date.now(),endAt+s*1000);tick()}
function stopT(){clearInterval(iv);clearTimeout(hideT);fin=false;tEl().classList.remove("on","end");wake(false)}
async function wake(on){try{if(on){if(navigator.wakeLock&&!wl)wl=await navigator.wakeLock.request("screen")}else if(wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&tEl().classList.contains("on")&&!fin){tick();if(!fin)wake(true)}});

const kg=80.9,h=175,age=43;const bmr=Math.round(10*kg+6.25*h-5*age+5);const tdee=Math.round(bmr*1.55);
return `<div class="card"><h3>⚙️ Ajustes</h3>

<div class="btns">${["Normal","Grande","Maior"].map((l,n)=>`<button class="btn t ${(S.opt.fs||0)==n?"sel":""}" onclick="setFs(${n})">${l}</button>`).join("")}</div>
<div class="small" style="margin-top:8px">Se o som não tocar, confira o volume do iPhone. Com a tela bloqueada o iPhone pode pausar o app: deixe a tela ligada durante o descanso. Versão do app: ${VER}.</div></div>
<div class="card"><h3>Seus números (estimativas)</h3><div class="grid">

</div><p class="small">Fórmula Mifflin-St Jeor × 1,55. Meta: ganhar ~0,25–0,4 kg/semana. Se subir mais rápido que isso, reduza ~150 kcal; se não subir em 2 semanas, aumente ~150 kcal.</p></div>
<div class="card"><h3>📈 Progressão de carga (dupla progressão)</h3><ul>
<li>Escolha uma carga dentro da faixa (ex.: 8–12). Toda semana tente <b>+1 rep</b> em alguma série.</li>
<li>Quando fizer o <b>topo da faixa em todas as séries</b> com boa técnica → suba a carga e volte para o início da faixa.</li>

<table><tr><th>Tipo</th><th>Aumento</th></tr>

<div class="card"><h3>⚡ Técnicas avançadas (aparecem sozinhas no treino)</h3>
<table><tr><th>Semanas</th><th>O que entra</th></tr>
<tr><td>1–2</td><td>Nada — só técnica e carga certa.</td></tr>
<tr><td>3–7</td><td><span class="tg biset">BI-SET</span> em braços/acessórios: 2 exercícios seguidos sem descanso. Economiza tempo e aumenta o estímulo.</td></tr>
<tr><td>6–7</td><td><span class="tg drop">DROP-SET</span> e <span class="tg rest">REST-PAUSE</span> só na <b>última série</b> de máquinas/isoladores.</td></tr>

<p class="small"><b>Bi-sets do plano:</b> Seg tríceps pulley + francês · Ter extensora + panturrilha sentado · Qua rosca direta + martelo · Qui flexora + abdutora · Sex rosca direta + tríceps testa e rosca martelo + tríceps corda.</p>
<p class="small">⚠️ Nunca use drop-set/rest-pause em <b>supino reto, agachamento e terra romeno</b> — nesses a fadiga extrema aumenta o risco de lesão. Aos 43 anos, a recuperação vale mais que a intensidade: se as articulações reclamarem, tire as técnicas daquela semana.</p></div>
<div class="card"><h3>Cuidados aos 43 anos</h3><ul>

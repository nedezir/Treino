};
const PH={1:"Sem 1–2: RIR 2–3 — foco em técnica e amplitude.",2:"Sem 1–2: RIR 2–3 — foco em técnica e amplitude.",3:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",4:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",5:"Sem 3–5: RIR 1–2 — aumente reps, depois carga.",6:"Sem 6–7: principais 6–10 reps, isoladores 10–15, RIR 1–2.",7:"Sem 6–7: principais 6–10 reps, isoladores 10–15, RIR 1–2.",8:"Sem 8 — DELOAD: corte ~40–50% das séries, cargas moderadas."};

else out.push({type:t[3],txt:TD[t[3]]})});return out}
function parse(v){if(!v)return null;v=v.replace(",",".");const m=v.match(/(\d+(?:\.\d+)?)/);if(!m)return null;const kg=+m[1];
const rest=v.slice(m.index+m[0].length);const r=rest.match(/\d+(?:\s*\/\s*\d+)+|\d+/);const reps=r?r[0].split("/").map(x=>+x.trim()):[];return{kg,reps}}
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:null};
const setsOf=(k,w)=>{const a=(S.sl[k]||{})[w]||[];return Array.from({length:4},(_,i)=>({c:(a[i]||{}).c||"",r:(a[i]||{}).r||""}))};
function topOf(k,w){const ss=setsOf(k,w).map(s=>({c:num(s.c),r:num(s.r)})).filter(s=>s.c!==null);if(!ss.length)return null;
const kg=Math.max(...ss.map(s=>s.c));const reps=ss.filter(s=>s.c===kg&&s.r!==null).map(s=>s.r);return{kg,reps}}
function sugest(e,k){const name=e[0],inc=INC[name]||2.5;const [lo,hi]=e[2].split("–").map(Number);
if(S.wk==8){const p=topOf(k,7)||topOf(k,6);return p?`Deload: use ~${r5(p.kg*0.8)} kg, parando com RIR 3.`:"Deload: carga ~20% menor que a sem. 7, RIR 3."}
if(S.wk==1)return"Semana 1: encontre uma carga em que termine a série com 2–3 reps sobrando.";
const p=topOf(k,S.wk-1);if(!p)return`Anote as cargas da semana ${S.wk-1} para ver a sugestão.`;
if(!p.reps.length)return`Semana passada: ${p.kg} kg. Anote as reps dessa carga para a sugestão.`;
if(p.reps.every(x=>x>=hi))return`🔼 Bateu ${hi} reps com ${p.kg} kg: suba para <b>${r5(p.kg+inc)} kg</b> e mire ${lo}–${lo+2} reps.`;
const min=Math.min(...p.reps);
if(min<lo)return`Abaixo da faixa (${min} reps com ${p.kg} kg): mantenha ou reduza para <b>${r5(p.kg-inc)} kg</b> e foque na técnica.`;
return`➡️ Mantenha <b>${p.kg} kg</b> e tente +1 rep nas séries abaixo de ${hi}.`}

function volWk(w){let v=0;days.forEach(d=>D[d].ex.forEach((_,i)=>setsOf(kEx(d,i,w),w).forEach(s=>{const c=num(s.c),r=num(s.r);if(c!==null&&r!==null)v+=c*r})));return v}
function resumo(){const wk=S.wk;let tEx=0,tDone=0,tSets=0,tVol=0,tCard=0;

${resumoDieta()}

const CH={};
function chart(title,unit,pts,color,id,dl){

const last=pts[pts.length-1];
return `<div class="card"><h3>${title}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: ${pts.length} medidas, última ${brn(last.v)} ${unit}">${grid}

<text x="${L}" y="${H-6}" fill="#94a3b8" font-size="10">${fmtD(pts[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#94a3b8" font-size="10">${fmtD(last.d)}</text></svg>

<div class="phase">${PH[S.wk]}</div>
${water()}
<div class="day-h">${cur} · ${d.t} <span class="small">(${c}/${n})</span></div>
<div class="prog"><i style="width:${c/n*100}%"></i></div>`+
d.ex.map((e0,i)=>{const e=exOf(cur,i),k=kEx(cur,i),sw=swapOf(cur,i);const L=S.log[k]||{};const isD=done.includes(i);
const series=S.wk==8?Math.max(2,Math.round(e[1]*0.55))+" (deload)":e[1];
const ws=new Set([...Object.keys(L),...Object.keys(S.sl[k]||{})]);
const hist=[...ws].filter(w=>w!=S.wk).sort((a,b)=>a-b).map(w=>{const cur2=setsOf(k,w).filter(s=>s.c||s.r);
if(cur2.length)return`Sem ${w}: `+cur2.map(s=>`${s.c||"?"}kg×${s.r||"?"}`).join(" · ");
return L[w]?`Sem ${w}: ${L[w]}`:""}).filter(Boolean).join("<br>");
const tc=techFor(cur,i);const bsFirst=tc.some(t=>t.type=="biset"&&t.first);const pr=REC[e[0]];
const prev=setsOf(k,S.wk-1),mine=setsOf(k,S.wk);
const grid=`<div class="sets"><div class="sh"></div><div class="sh">Carga (kg)</div><div class="sh">Reps</div>`+mine.map((s,i)=>`<div class="sn">S${i+1}</div>
<input inputmode="decimal" placeholder="${prev[i].c?prev[i].c+" kg":"kg"}" value="${s.c}" onchange="setS('${k}',${i},'c',this.value)">

return `<div class="ex ${isD?"done":""} ${tc.length?"tq":""}">

${sw?`<div class="small">Substitui: ${esc(D[cur].ex[i][0])}</div>`:""}
<div class="tip">✅ ${e[5]}</div>
<div class="sug">${sugest(e,k)}</div>
${pr?`<div class="small" style="margin:-4px 0 10px">🏆 Recorde: ${brn(pr.kg)} kg${pr.reps?" × "+pr.reps:""} (sem ${pr.wk})${pr.isNew?" · <b style=\"color:var(--ac)\">novo!</b>":""}</div>`:""}
<div class="btns"><a class="btn" href="${V(e[0])}" target="_blank" rel="noopener">▶ Ver execução</a><button class="btn t" onclick="startT(${e[4]})">⏱ ${fmt(e[4])}</button><button class="btn t" style="flex:0 0 auto;padding:11px 14px" onclick="openSwap(${i})" aria-label="Trocar exercício">⇄</button><button class="btn t" style="flex:0 0 auto;padding:11px 14px" onclick="openMedia(${i})" aria-label="Foto ou vídeo da execução">📷</button></div>
${grid}
${hist?`<div class="hist"><b>Histórico</b><br>${hist}</div>`:""}
</div>`}).join("")+cardio(cur)}

return `<div class="ex ${on?"done":""}" style="border-color:#0891b255"><div class="ex-top"><div class="ex-n"><span class="num">🚴</span>Cardio · bicicleta ou esteira</div><button class="chk" onclick="tgc('${k}')">${on?"✓":""}</button></div>

function tgc(k){S.cd[k]=S.cd[k]||{};S.cd[k].d=!S.cd[k].d;save();render()}

function setS(k,i,f,v,rest){S.sl[k]=S.sl[k]||{};const a=S.sl[k][S.wk]=S.sl[k][S.wk]||[{},{},{},{}];a[i]=a[i]||{};const old=a[i][f]||"";a[i][f]=String(v).trim();save();if(f==="r"&&!old&&a[i][f]&&S.opt.auto&&rest>0)startT(rest)}

function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
/* ---------- cronômetro de descanso ---------- */
let endAt=0,iv=null,fin=false,wl=null,hideT=null,audioEl=null,actx=null,unlocked=false;
const tEl=()=>document.getElementById("timer");
function mkWav(){const sr=22050,beeps=[[0,.22],[.34,.56],[.68,.90]],n=Math.floor(sr*1.2),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
for(let i=0;i<n;i++){const t=i/sr;let a=0;for(const [s,e] of beeps){if(t>=s&&t<e){const env=Math.min(1,(t-s)/.01,(e-t)/.02);a=Math.sin(2*Math.PI*1000*t)*0.9*env}}v.setInt16(44+i*2,Math.round(a*32767),true)}
return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))}
function unlockAudio(){if(unlocked)return;
try{if(!audioEl){audioEl=new Audio(mkWav());audioEl.preload="auto"}audioEl.muted=true;const p=audioEl.play();
if(p&&p.then)p.then(()=>{audioEl.pause();audioEl.currentTime=0;audioEl.muted=false;unlocked=true}).catch(()=>{audioEl.muted=false})}catch(e){}
try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){actx=actx||new AC();if(actx.state==="suspended")actx.resume()}}catch(e){}}
["touchend","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function webBeep(){try{const AC=window.AudioContext||window.webkitAudioContext;actx=actx||new AC();if(actx.state==="suspended")actx.resume();
[0,.34,.68].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime+t;o.frequency.value=1000;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.8,n+.01);g.gain.exponentialRampToValueAtTime(0.0001,n+.22);o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+.25)})}catch(e){}}
function playAlarm(){try{if(audioEl){audioEl.muted=false;audioEl.currentTime=0;const p=audioEl.play();if(p&&p.catch)p.catch(webBeep);return}}catch(e){}webBeep()}
function testSound(){try{if(!audioEl)audioEl=new Audio(mkWav());unlocked=true}catch(e){}playAlarm()}
function startT(s){if(!(s>0))return;fin=false;clearTimeout(hideT);endAt=Date.now()+s*1000;tEl().classList.remove("end");tEl().classList.add("on");document.getElementById("tl").textContent="Descanso";clearInterval(iv);iv=setInterval(tick,250);tick();wake(true)}
function tick(){const left=Math.ceil((endAt-Date.now())/1000);if(left<=0){clearInterval(iv);document.getElementById("tv").textContent="0:00";if(!fin){fin=true;finish()}return}document.getElementById("tv").textContent=fmt(left)}
function finish(){tEl().classList.add("end");document.getElementById("tl").textContent="Descanso acabou! 💪";if(S.opt.sound)playAlarm();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}clearTimeout(hideT);hideT=setTimeout(stopT,12000);wake(false)}
function addT(s){if(fin){if(s>0)startT(s);return}endAt=Math.max(Date.now(),endAt+s*1000);tick()}
function stopT(){clearInterval(iv);clearTimeout(hideT);fin=false;tEl().classList.remove("on","end");wake(false)}
async function wake(on){try{if(on){if(navigator.wakeLock&&!wl)wl=await navigator.wakeLock.request("screen")}else if(wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&tEl().classList.contains("on")&&!fin){tick();if(!fin)wake(true)}});

function bkBanner(){const last=S.lastBk||S.bk0||Date.now(),now=Date.now();if(now<(S.bkSnz||0)||now-last<7*864e5)return"";

return `<div class="card" style="border:1px solid var(--warn)"><h3>💾 Hora do backup</h3><p class="small">${S.lastBk?"Último backup há "+dias+" dias.":"Você ainda não fez backup."} Seus dados ficam só neste iPhone: exporte o arquivo e guarde no iCloud ou mande para você mesmo.</p><div class="btns"><button class="btn" onclick="exportData();render()">Exportar agora</button><button class="btn t" onclick="S.bkSnz=Date.now()+864e5;save();render()">Amanhã</button></div></div>`}
const WDN=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function hoje(){const now=new Date(),wd=WDN[now.getDay()],day=days.includes(wd)?wd:null,wk=S.wk;
let o=bkBanner();
o+=`<div class="wk">📅<select onchange="S.wk=+this.value;save();render()">${[1,2,3,4,5,6,7,8].map(w=>`<option value="${w}" ${w==wk?"selected":""}>Semana ${w}</option>`).join("")}</select></div>
<div class="card"><h3>🏠 Hoje · ${wd}, ${fmtD(todayStr())}</h3>`;
if(day){const n=D[day].ex.length,c=(S.done[wk+"|"+day]||[]).length;
o+=`<div class="drow"><span>🏋️ ${esc(D[day].t)}</span><span><b>${c}/${n}</b> exercícios</span></div><div class="prog" style="margin:4px 0 10px"><i style="width:${c/n*100}%"></i></div><button class="btn" style="width:100%" onclick="go('${day}')">Abrir treino de ${day}</button>`;
if(CARDIO[day]){const cd=(S.cd["c|"+wk+"|"+day]||{}).d;o+=`<div class="drow" style="margin-top:12px"><span>🚴 Cardio de ${CMIN(wk)} min (outro horário)</span><b>${cd?"✓ feito":"pendente"}</b></div>`}}
else o+=`<p class="small">Sem treino de musculação hoje. Descanse, caminhe e capriche na comida e no sono.</p>`;
o+=`</div>`;
const G=(S.wgoal||{})[wd]||3000,v=(S.water||{})[wk+"|"+wd]||0,pc=Math.min(100,Math.round(v/G*100));
o+=`<div class="card" style="border:1px solid #0ea5e955"><h3>💧 Água</h3><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:26px;font-weight:800;color:#38bdf8">${fl(v)} L</span><span class="small">meta ${fl(G)} L${v>=G?" ✓ batida!":""}</span></div><div class="prog" style="margin:8px 0"><i style="width:${pc}%;background:#38bdf8"></i></div><div class="btns"><button class="btn t" onclick="addWd('${wd}',250)">+250 ml</button><button class="btn t" onclick="addWd('${wd}',500)">+500 ml</button><button class="btn t" onclick="addWd('${wd}',-250)">−250</button></div></div>`;
const t=sumEat(null,todayStr()),pl=planAll(),nm=Object.keys(S.eat[todayStr()]||{}).map(x=>+x.split("|")[0]),nref=new Set([...nm,...(S.eatx[todayStr()]||[]).map(x=>x.mi)]).size;
o+=`<div class="card"><h3>🍽 Dieta de hoje</h3><div class="drow"><span>Calorias</span><span><b>${brn(t.k,0)}</b> / ${brn(num(S.diet.goal.k)||Math.round(pl.k),0)} kcal</span></div><div class="prog" style="margin:2px 0 8px"><i style="width:${Math.min(100,Math.round(t.k/(num(S.diet.goal.k)||pl.k)*100))}%"></i></div><div class="drow"><span>Proteína</span><span><b>${brn(t.p,0)}</b> / ${brn(num(S.diet.goal.p)||Math.round(pl.p),0)} g</span></div><p class="small" style="margin:8px 0">${nref} de ${DP.length} refeições registradas.</p><button class="btn t" style="width:100%" onclick="goDiet()">Registrar refeições</button></div>`;
const ult=S.meas.length?S.meas[S.meas.length-1].d:"",lim=ymd(new Date(Date.now()-7*864e5));
if(!ult||ult<lim)o+=`<div class="card"><h3>📏 Hora de medir</h3><p class="small">${ult?"Última medida em "+fmtD(ult)+".":"Nenhuma medida ainda."} Meça peso, cintura e abdômen uma vez por semana, no mesmo horário.</p><button class="btn t" style="width:100%" onclick="go('Medidas')">Registrar medidas</button></div>`;
return o}
function perfil(){
const kg=S.meas.filter(m=>m.w!=null).slice(-1).map(m=>m.w)[0]||80.9,h=175,age=43,G=S.opt.goal||"cut";const bmr=Math.round(10*kg+6.25*h-5*age+5);const tdee=Math.round(bmr*1.55);
return `<div class="card"><h3>⚙️ Ajustes</h3>
<label class="opt"><input type="checkbox" ${S.opt.sound?"checked":""} onchange="S.opt.sound=this.checked;save()"><span>Som quando o descanso acabar</span></label>
<label class="opt"><input type="checkbox" ${S.opt.auto?"checked":""} onchange="S.opt.auto=this.checked;save()"><span>Iniciar o descanso ao anotar as reps de uma série</span></label>
<button class="btn t" style="width:100%;margin:6px 0" onclick="testSound()">🔊 Testar som</button>
<div class="small" style="margin:8px 0 4px">Meu objetivo</div><div class="btns">${[["cut","Perder gordura"],["keep","Manter"],["bulk","Ganhar massa"]].map(([g,l])=>`<button class="btn t ${G===g?"sel":""}" onclick="S.opt.goal='${g}';save();render()">${l}</button>`).join("")}</div>
<div class="small" style="margin:8px 0 4px">Tamanho da letra</div>
<div class="btns">${["Normal","Grande","Maior"].map((l,n)=>`<button class="btn t ${(S.opt.fs||0)==n?"sel":""}" onclick="setFs(${n})">${l}</button>`).join("")}</div>
<div class="small" style="margin-top:8px">Se o som não tocar, confira o volume do iPhone. Com a tela bloqueada o iPhone pode pausar o app: deixe a tela ligada durante o descanso. Versão do app: ${VER}.</div><div class="small" style="margin-top:6px">Fotos e vídeos de execução ficam só neste aparelho e não entram no backup (arquivo .json).</div></div>
<div class="card"><h3>Seus números (estimativas)</h3><div class="grid">
<div class="stat"><div class="v">${(kg/1.75/1.75).toFixed(1)}</div><div class="l">IMC (${brn(kg)} kg)</div></div>
<div class="stat"><div class="v">~${tdee}</div><div class="l">kcal manutenção</div></div>
<div class="stat"><div class="v">${G==="cut"?`~${tdee-500}–${tdee-300}`:G==="bulk"?`~${tdee+250}–${tdee+350}`:`~${tdee-100}–${tdee+100}`}</div><div class="l">kcal ${G==="cut"?"para emagrecer":G==="bulk"?"para ganhar massa":"para manter"}</div></div>
<div class="stat"><div class="v">130–175 g</div><div class="l">proteína/dia (1,6–2,2 g/kg)</div></div>
</div><p class="small">Fórmula Mifflin-St Jeor × 1,55. ${G==="cut"?"Meta: perder ~0,3–0,5 kg por semana, mantendo a proteína alta e o treino de força para preservar o músculo. Se a balança cair mais rápido que isso, aumente ~150 kcal. Se não mexer em 2–3 semanas (e a cintura também não), reduza ~150 kcal. Siga primeiro o plano da sua nutricionista; estes números são só uma referência.":G==="bulk"?"Meta: ganhar ~0,25–0,4 kg por semana. Se subir mais rápido que isso, reduza ~150 kcal; se não subir em 2 semanas, aumente ~150 kcal.":"Meta: manter o peso e a cintura estáveis enquanto o treino melhora."}</p></div>
<div class="card"><h3>📈 Progressão de carga (dupla progressão)</h3><ul>
<li>Escolha uma carga dentro da faixa (ex.: 8–12). Toda semana tente <b>+1 rep</b> em alguma série.</li>
<li>Quando fizer o <b>topo da faixa em todas as séries</b> com boa técnica → suba a carga e volte para o início da faixa.</li>
<li>Anote a <b>carga</b> e as <b>reps</b> de cada série (S1 a S4). O app olha a carga mais pesada da semana passada e mostra a sugestão em verde.</li>
<li><b>RIR</b> = repetições que ainda sobrariam. RIR 2 = parar 2 reps antes da falha.</li></ul>
<table><tr><th>Tipo</th><th>Aumento</th></tr>
<tr><td>Supino / barra (superiores)</td><td>+2–2,5 kg</td></tr>
<tr><td>Agachamento, terra romeno</td><td>+5 kg</td></tr>
<tr><td>Leg press, hip thrust</td><td>+10 kg</td></tr>
<tr><td>Halteres compostos</td><td>+2 kg por halter</td></tr>
<tr><td>Elevação lateral, martelo, crucifixo inv.</td><td>+1 kg (ou só reps)</td></tr>
<tr><td>Máquinas / polia</td><td>+1 placa (2,5–5 kg)</td></tr></table></div>
<div class="card"><h3>⚡ Técnicas avançadas (aparecem sozinhas no treino)</h3>
<table><tr><th>Semanas</th><th>O que entra</th></tr>
<tr><td>1–2</td><td>Nada — só técnica e carga certa.</td></tr>
<tr><td>3–7</td><td><span class="tg biset">BI-SET</span> em braços/acessórios: 2 exercícios seguidos sem descanso. Economiza tempo e aumenta o estímulo.</td></tr>
<tr><td>6–7</td><td><span class="tg drop">DROP-SET</span> e <span class="tg rest">REST-PAUSE</span> só na <b>última série</b> de máquinas/isoladores.</td></tr>
<tr><td>8</td><td>Deload: sem técnicas, menos séries, ~20% menos carga.</td></tr></table>
<p class="small"><b>Bi-sets do plano:</b> Seg tríceps pulley + francês · Ter extensora + panturrilha sentado · Qua rosca direta + martelo · Qui flexora + abdutora · Sex rosca direta + tríceps testa e rosca martelo + tríceps corda.</p>
<p class="small">⚠️ Nunca use drop-set/rest-pause em <b>supino reto, agachamento e terra romeno</b> — nesses a fadiga extrema aumenta o risco de lesão. Aos 43 anos, a recuperação vale mais que a intensidade: se as articulações reclamarem, tire as técnicas daquela semana.</p></div>
<div class="card"><h3>Cuidados aos 43 anos</h3><ul>
<li>Aquecimento de 5–10 min + 1–2 séries leves antes do 1º exercício de cada dia.</li>
<li>Durma 7–8 h — é quando o músculo cresce.</li>
<li>Dor articular (não muscular) = reduza carga ou troque o exercício.</li>
<li>Faça check-up / avaliação médica antes de aumentar a intensidade, e se possível acompanhe com um educador físico e nutricionista.</li>
<li>Creatina 3–5 g/dia é um dos suplementos com melhor evidência (confirme com seu médico).</li></ul></div>
<div class="card"><h3>Semana</h3><ul>
<li><b>Seg</b> Peito + Tríceps</li><li><b>Ter</b> Quadríceps + Panturrilha <span class="small">+ cardio</span></li><li><b>Qua</b> Costas + Bíceps</li><li><b>Qui</b> Posterior + Glúteos <span class="small">+ cardio</span></li><li><b>Sex</b> Ombros + Braços</li><li><b>Sáb/Dom</b> Descanso</li></ul>
<div class="small" style="margin-top:10px">Seus registros ficam salvos só neste aparelho. Faça backup de vez em quando.</div>
<div class="btns" style="margin-top:6px"><button class="btn t" onclick="exportData()">⬇ Exportar</button><label class="btn t" style="cursor:pointer">⬆ Importar<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div>
<button class="btn t" style="width:100%;margin-top:8px" onclick="if(confirm('Apagar TODOS os registros, medidas e dieta?')){S={};norm();save();render()}">Zerar registros</button></div>`}
applyFs();render();
